<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Página não encontrada (404) | Hostel JK</title>
    <meta
      name="description"
      content="A página que você procura não existe ou mudou de endereço. Volte para a página inicial do Hostel JK."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b0b0c" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hostel JK" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Página não encontrada | Hostel JK" />
    <meta property="og:description" content="A página que você procura não existe. Conheça o Hostel JK, no Centro de Bom Jesus – PI." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Página não encontrada | Hostel JK" />
    <meta name="twitter:description" content="A página que você procura não existe. Conheça o Hostel JK, no Centro de Bom Jesus – PI." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <style>
      html {
        background: #0b0b0c;
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <main class="error-page">
      <a href="/" class="error-page__logo" aria-label="Hostel JK, ir para a página inicial">
        <span class="logo">
          <svg width="34" height="20" viewBox="0 0 34 20" class="logo__roof" aria-hidden="true">
            <path d="M2 18 L17 3 L32 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            <rect x="13" y="12" width="8" height="6" fill="currentColor" />
          </svg>
          <span class="logo__hostel">HOSTEL</span>
          <span class="logo__jk-row"><span class="logo__jk">JK</span></span>
        </span>
      </a>

      <p class="error-page__code" aria-hidden="true">404</p>
      <h1 class="error-page__title">Essa página não existe</h1>
      <p class="error-page__text">
        O endereço pode ter sido digitado errado ou a página mudou de lugar. Mas o seu quarto continua aqui, te esperando.
      </p>

      <div class="error-page__actions">
        <a href="/" class="button button--primary">Voltar para a página inicial</a>
        <a href="%WHATSAPP_URL%" class="button button--outline" target="_blank" rel="noopener noreferrer">Falar no WhatsApp</a>
      </div>
    </main>
  </body>
</html>
